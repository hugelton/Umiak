<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umiak</title><link rel="stylesheet" href="./style.css"></head>
<body>
<header class="appbar"><strong class="brand">Umiak</strong>
<div class="transport"><button id="audio">Enable audio</button><button id="start">▶ Play</button><button id="stop">■ Stop</button><button id="reset">↺ Reset</button></div>
<label>Tempo <input id="bpm" type="number" min="20" max="300" value="120"></label>
<button id="save">Save project</button><label>Open project <input id="load" type="file" accept=".json,application/json"></label><p id="status" role="status">Audio disabled</p></header>
<main class="studio">
<section class="panel patch-stage"><header><h2>PATCH CANVAS <small> / SIGNAL FLOW</small></h2><div class="module-tools"><button id="add-transpose">+ Transpose</button> <button id="add-quantize">+ Quantize</button> <button id="add-scale">+ Scale</button> <button id="add-invert">+ Invert</button> <button id="disconnect">Disconnect</button> <button id="reconnect">Connect</button></div></header>
<div class="nodeboard" id="nodeboard"><svg class="wires" id="wires" aria-hidden="true"></svg>
<div class="node" data-node="sequence" style="left:20px;top:30px"><div class="title">Step LUT</div><div class="ports"><span>phase</span><span>pitch <i class="port"></i></span></div></div>
<div class="node" data-node="oscillator" style="left:210px;top:100px"><div class="title">Curve LUT / OSC</div><div class="ports"><span><i class="port"></i> pitch</span><span>audio <i class="port"></i></span></div></div>
</div></section>

<div class="dock" id="dock">
<nav class="dock-tabs" aria-label="Workspace panels"><button class="dock-tab" data-target="wave-panel" aria-selected="true">WAVEFORM</button><button class="dock-tab" data-target="sequence-panel" aria-selected="false">SEQUENCE</button><button class="dock-tab" data-target="keyboard-panel" aria-selected="false">KEYBOARD</button><span class="dock-spacer"></span><button id="dock-toggle" aria-expanded="true" title="Collapse dock">⌄</button></nav>
<div class="dock-content">
<div id="wave-panel" class="dock-pane"><section class="panel"><header><h2>Oscillator / Curve LUT</h2><label>Harmonic <input id="harmonic" type="range" min="1" max="8" value="1"></label></header><div class="body"><div class="wave-morph"><span>Wave LUT</span> <button data-slot="0">1</button> <button data-slot="1">2</button> <button data-slot="2">3</button> <button data-slot="3">4</button> <span>Edit <output id="slot-label">1</output></span> <label>Transition <input id="morph" type="range" min="0" max="3" step="0.01" value="0"></label> <output id="morph-value">0.00</output></div><canvas id="curve" class="curve" width="720" height="190" aria-label="Draw oscillator waveform"></canvas></div></section></div>
<div id="sequence-panel" class="dock-pane" hidden><section class="panel"><header><h2>Sequence / Step LUT</h2><span>Pitch · C4 relative</span></header><div class="body"><div id="steps" class="stepgrid"></div></div></section></div>
<div id="keyboard-panel" class="dock-pane" hidden><section class="panel"><header><h2>Instrument / Keyboard</h2><label>Waveform <select id="wave"><option>sine</option><option>triangle</option><option>sawtooth</option><option>square</option><option selected>custom</option></select></label></header><div class="body"><div id="keys" class="keyboard"></div></div></section></div>
</div></div></main><script type="module" src="./src/main.js"></script><script type="module" src="./src/patch.js"></script><script type="module" src="./src/workspace.js"></script>
</body></html>
